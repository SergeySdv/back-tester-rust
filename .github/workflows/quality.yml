name: quality

on:
  push:
  pull_request:

jobs:
  quality-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
      - run: rustup component add llvm-tools-preview rustfmt clippy
      - run: >-
          rustup toolchain install nightly-2026-08-01
          --profile minimal --component llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: uv sync --locked --group dev
      - run: ./scripts/quality.sh
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features
      - run: uv run maturin develop
      - run: uv run pytest
      - run: ./scripts/coverage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage/
