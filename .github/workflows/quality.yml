name: quality

on:
  push:
  pull_request:

jobs:
  tests-and-line-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
      - run: rustup component add llvm-tools-preview rustfmt clippy
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: uv sync --locked --group dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: uv run maturin develop
      - run: uv run pytest
      - run: mkdir -p target/coverage
      - run: >-
          cargo llvm-cov --workspace --all-features
          --fail-under-lines 90
          --json --output-path target/coverage/rust-lines.json
      - run: >-
          uv run python -m pytest
          --cov=back_tester --cov-branch
          --cov-report=term-missing
          --cov-report=json:target/coverage/python.json
      - uses: actions/upload-artifact@v4
        with:
          name: stable-coverage
          path: target/coverage/

  rust-branch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: mkdir -p target/coverage
      - run: >-
          cargo +nightly-2026-08-01 llvm-cov --workspace --all-features
          --branch --json --output-path target/coverage/rust-branches.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-branch-coverage
          path: target/coverage/rust-branches.json

  coverage-gate:
    needs: [tests-and-line-coverage, rust-branch-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stable-coverage
          path: target/coverage
      - uses: actions/download-artifact@v4
        with:
          name: rust-branch-coverage
          path: target/coverage
      - run: >-
          python scripts/check_coverage.py
          --rust-lines target/coverage/rust-lines.json --min-rust-lines 90
          --rust-branches target/coverage/rust-branches.json --min-rust-branches 85
          --python target/coverage/python.json
          --min-python-lines 85 --min-python-branches 80
