[workspace]
members = ["crates/backtest-core", "crates/backtest-python"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
libm = "0.2.16"
pyo3 = { version = "0.29.2", features = ["abi3-py39", "extension-module"] }

[workspace.lints.clippy]
cognitive_complexity = "deny"
excessive_nesting = "deny"
too_many_lines = "deny"
